name: Update Ken stories
on:
  schedule:
    - cron: "30 2 * * *"   # every day, 8:00 AM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_ken.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git commit -am "New Ken story on the Writing list"
            git push
          fi
